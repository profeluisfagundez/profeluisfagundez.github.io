
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz inversa 3x3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calculadora de matriz inversa para INET</h1>

    <p>Ingresar los valores de una matriz de 3 × 3:</p>

    <form id="formulario-matriz">
        <div class="matriz">
            <input type="number" id="a" required>
            <input type="number" id="b" required>
            <input type="number" id="c" required>

            <input type="number" id="d" required>
            <input type="number" id="e" required>
            <input type="number" id="f" required>

            <input type="number" id="g" required>
            <input type="number" id="h" required>
            <input type="number" id="i" required>
        </div>

        <button type="submit">Calcular inversa de la Matriz</button>
    </form>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
